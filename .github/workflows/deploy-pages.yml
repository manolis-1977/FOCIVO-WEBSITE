name: Deploy FORYMO Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate public website language release
        run: |
          node --check app.js
          node scripts/check-language-readiness.cjs
          node scripts/test-pt-br.cjs
          node scripts/test-all-locales.cjs
          node scripts/test-support-bot.cjs
          node scripts/test-product-alignment.cjs
          node scripts/test-customer-copy.cjs
          node scripts/build-public.cjs
          node scripts/test-social-preview.cjs

      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_public'

      - name: Wait for artifact registration
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live social preview via public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          agent='facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 25 -A "$agent" https://www.forymo.com/ -o "$tmp/index.html" &&
               grep -Fq 'property="og:image" content="https://www.forymo.com/assets/forymo-social-preview.jpg"' "$tmp/index.html" &&
               curl -fsSL --max-time 25 -A "$agent" https://www.forymo.com/assets/forymo-social-preview.jpg -o "$tmp/preview.jpg" &&
               cmp -s "$tmp/preview.jpg" _public/assets/forymo-social-preview.jpg; then
              echo 'PASS: Public homepage exposes Open Graph image; public JPEG matches the deployed artifact for Facebook crawler user-agent.'
              exit 0
            fi
            sleep 10
          done
          echo 'FAIL: Could not verify the public social preview.'
          exit 1
