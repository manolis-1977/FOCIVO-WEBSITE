name: Deploy FORYMO Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate public website language release
        run: |
          node --check app.js
          node scripts/check-language-readiness.cjs
          node scripts/test-pt-br.cjs
          node scripts/test-all-locales.cjs
          node scripts/test-support-bot.cjs
          node scripts/test-product-alignment.cjs
          node scripts/test-customer-copy.cjs
          node scripts/build-public.cjs
          node scripts/test-social-preview.cjs

      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_public'

      - name: Wait for artifact registration
        run: sleep 10

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
